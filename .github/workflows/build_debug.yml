name: Build Godot Application

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            export_name: "Windows Desktop"
            output_path: build/windows/debug.exe
            artifact_name: windows-debug

          - os: macos-latest
            target: macos
            export_name: "macOS"
            output_path: build/macos/debug.zip
            artifact_name: macos-debug

          - os: ubuntu-latest
            target: android
            export_name: "Android"
            output_path: build/android/debug.apk
            artifact_name: android-debug

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoftgames/setup-godot@v1
        with:
          version: 4.2.1
          include_templates: true

      - name: Setup Java
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        if: matrix.target == 'android'
        uses: android-actions/setup-android@v3

      - name: Build Project
        shell: bash
        run: |
          godot --headless --export "${{ matrix.export_name }}" "${{ matrix.output_path }}"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.output_path }}
