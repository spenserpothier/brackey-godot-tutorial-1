name: Build Godot Application

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: "Web"
            output: "build/New Game Tutorial.html"
            artifact: web-build

          - os: macos-latest
            preset: "macOS"
            output: "build/New Game Tutorial.dmg"
            artifact: macos-build

          - os: ubuntu-latest
            preset: "Android"
            output: "./SalonGame.apk"
            artifact: android-build

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoftgames/setup-godot@v1
        with:
          version: 4.2.1
          include_templates: true

      - name: Setup Java
        if: ${{ matrix.preset == 'Android' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        if: ${{ matrix.preset == 'Android' }}
        uses: android-actions/setup-android@v3

      - name: Build Project
        shell: bash
        run: |
          godot --headless --export "${{ matrix.preset }}" "${{ matrix.output }}"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
