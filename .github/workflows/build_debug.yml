name: Build Godot Application

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            preset: "Windows Desktop"
            output: "build/windows/debug.exe"
            artifact: windows-debug
            shell: pwsh

          - os: macos-latest
            target: macos
            preset: "macOS"
            output: "build/New Game Tutorial.dmg"
            artifact: macos-debug
            shell: bash

          - os: ubuntu-latest
            target: android
            preset: "Android"
            output: "./SalonGame.apk"
            artifact: android-debug
            shell: bash

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        if: ${{ matrix.target == 'android' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        if: ${{ matrix.target == 'android' }}
        uses: android-actions/setup-android@v3

      - name: Install Godot
        shell: ${{ matrix.shell }}
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            curl -L -o godot.zip https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_win64.exe
            Rename-Item godot.zip godot.exe
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            curl -L -o godot.zip https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_macos.universal.zip
            unzip -o godot.zip
            chmod +x "Godot.app/Contents/MacOS/Godot"
            echo "$(pwd)/Godot.app/Contents/MacOS" >> $GITHUB_PATH
          else
            curl -L -o godot.zip https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_linux.x86_64.zip
            unzip -o godot.zip
            chmod +x Godot_v4.2.1-stable_linux.x86_64
            echo "$(pwd)" >> $GITHUB_PATH
          fi

      - name: Build Project
        shell: ${{ matrix.shell }}
        run: |
          mkdir -p "$(dirname "${{ matrix.output }}")"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ./godot.exe --headless --export "${{ matrix.preset }}" "${{ matrix.output }}"
          else
            godot --headless --export "${{ matrix.preset }}" "${{ matrix.output }}"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
